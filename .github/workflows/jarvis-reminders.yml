name: JARVIS background reminder dispatcher
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: jarvis-reminder-dispatch
  cancel-in-progress: false
jobs:
  dispatch-due-reminders:
    if: github.repository == 'anuveytq-sys/JARVIS-WEB' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Authenticate scheduler and dispatch due reminders
        shell: bash
        env:
          DISPATCH_URL: https://jarvis-reminder-backend.vercel.app/api/dispatch
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jarvis-reminder-dispatch")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          echo "::add-mask::$token"
          result="$(curl --fail --silent --show-error --max-time 45 \
            -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" "$DISPATCH_URL")"
          printf '%s' "$result" | jq -e '.ok == true'
