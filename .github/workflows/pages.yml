name: Publish JARVIS GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_VERSION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser JavaScript
        run: |
          node --check docs/jarvis-web.js
          node --check docs/jarvis-ui-patch.js
          node --check docs/jarvis-camera-fix.js
          node --check docs/jarvis-popup-fix.js
          node --check docs/jarvis-superpowers.js
          node --check docs/jarvis-focus-detector.js
          node --check docs/jarvis-music.js
          node --check docs/jarvis-velve.js
          node --check docs/jarvis-velve-fix.js
          node --check docs/jarvis-velve-stability.js
          node --check docs/velve-satellite-upgrade.js
          node --check docs/terranexus.js
          node --check docs/jarvis-neon-nexus.js
          node --check docs/jarvis-neon-nexus-launcher-fix.js
          node --check docs/jarvis-neon-nexus-command-fix.js
          node --check docs/jarvis-core-3d.js

      - name: Verify JARVIS and VELVE upgrades
        run: |
          grep -q 'openEnvironment(name)' docs/jarvis-neon-nexus.js
          grep -q 'GROUP=active&FORMAT=json' docs/velve-satellite-upgrade.js
          grep -q 'chosen.length>=200' docs/velve-satellite-upgrade.js
          grep -q 'new C.ScreenSpaceEventHandler(canvas)' docs/velve-satellite-upgrade.js
          grep -q 'viewer.trackedEntity=undefined' docs/velve-satellite-upgrade.js
          grep -q 'async function getJsonGroup' docs/velve-satellite-upgrade.js
          grep -q 'velve-satellite-info' docs/velve-satellite-upgrade.js
          grep -q 'velve-voice' docs/velve-satellite-upgrade.js
          grep -q 'velve-maptiler-key' docs/velve-satellite-upgrade.js
          grep -q 'minimumZoomDistance=120' docs/jarvis-velve-stability.js
          grep -q 'jarvis-core-3d' docs/jarvis-core-3d.js

      - name: Build Pages site from original HUD
        run: |
          rm -rf _site
          mkdir -p _site
          cp public/index.html _site/index.html
          cp docs/jarvis-web.js _site/jarvis-web.js
          cp docs/jarvis-ui-patch.js _site/jarvis-ui-patch.js
          cp docs/jarvis-camera-fix.js _site/jarvis-camera-fix.js
          cp docs/jarvis-popup-fix.js _site/jarvis-popup-fix.js
          cp docs/jarvis-superpowers.js _site/jarvis-superpowers.js
          cp docs/jarvis-focus-detector.js _site/jarvis-focus-detector.js
          cp docs/jarvis-music.js _site/jarvis-music.js
          cp docs/jarvis-command-center.css _site/jarvis-command-center.css
          cp docs/jarvis-velve.css _site/jarvis-velve.css
          cp docs/jarvis-velve.js _site/jarvis-velve.js
          cp docs/jarvis-velve-fix.js _site/jarvis-velve-fix.js
          cp docs/jarvis-velve-stability.js _site/jarvis-velve-stability.js
          cp docs/velve-satellite-upgrade.js _site/velve-satellite-upgrade.js
          cp docs/terranexus.js _site/terranexus.js
          cp docs/terranexus.css _site/terranexus.css
          cp docs/jarvis-neon-nexus.js _site/jarvis-neon-nexus.js
          cp docs/jarvis-neon-nexus.css _site/jarvis-neon-nexus.css
          cp docs/jarvis-neon-nexus-launcher-fix.js _site/jarvis-neon-nexus-launcher-fix.js
          cp docs/jarvis-neon-nexus-command-fix.js _site/jarvis-neon-nexus-command-fix.js
          cp docs/jarvis-core-3d.js _site/jarvis-core-3d.js
          cp docs/jarvis-core-3d.css _site/jarvis-core-3d.css
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          version = os.environ['SITE_VERSION'][:12]
          head_marker = '</head>'
          style = f'<link rel="stylesheet" href="./jarvis-command-center.css?v=pages-{version}">\n<link rel="stylesheet" href="./jarvis-velve.css?v=pages-{version}">\n<link rel="stylesheet" href="./terranexus.css?v=pages-{version}">\n<link rel="stylesheet" href="./jarvis-core-3d.css?v=pages-{version}">\n<style>body.velve-active #jarvis-wake-word-toggle,body.velve-active #jarvis-web-bridge-panel,body.velve-active #jarvis-superpowers,body.velve-active #jarvis-settings-trigger{{display:none!important}}</style>\n'
          for name in ['jarvis-command-center','jarvis-velve','terranexus','jarvis-core-3d']:
              s = re.sub(rf'<link[^>]+{re.escape(name)}\.css\?v=[^\"]+[^>]*>\s*', '', s)
          s = s.replace(head_marker, style + head_marker, 1)
          marker = '</body>'
          injection = f'<script src="./jarvis-popup-fix.js?v=pages-{version}"></script>\n<script src="./jarvis-camera-fix.js?v=pages-{version}"></script>\n<script src="./jarvis-ui-patch.js?v=pages-{version}"></script>\n<script src="./jarvis-web.js?v=pages-{version}"></script>\n<script src="./jarvis-music.js?v=pages-{version}"></script>\n<script src="./jarvis-focus-detector.js?v=pages-{version}"></script>\n<script src="./jarvis-superpowers.js?v=pages-{version}"></script>\n<script src="./jarvis-velve-stability.js?v=pages-{version}"></script>\n<script src="./jarvis-velve.js?v=pages-{version}"></script>\n<script src="./jarvis-velve-fix.js?v=pages-{version}"></script>\n<script src="./velve-satellite-upgrade.js?v=pages-{version}"></script>\n<script src="./terranexus.js?v=pages-{version}"></script>\n<script src="./jarvis-neon-nexus.js?v=pages-{version}"></script>\n<script src="./jarvis-neon-nexus-launcher-fix.js?v=pages-{version}"></script>\n<script src="./jarvis-neon-nexus-command-fix.js?v=pages-{version}"></script>\n<script src="./jarvis-core-3d.js?v=pages-{version}"></script>\n'
          for name in ['jarvis-popup-fix','jarvis-camera-fix','jarvis-ui-patch','jarvis-web','jarvis-music','jarvis-focus-detector','jarvis-superpowers','jarvis-velve-stability','jarvis-velve','jarvis-velve-fix','velve-satellite-upgrade','terranexus','jarvis-neon-nexus','jarvis-neon-nexus-launcher-fix','jarvis-neon-nexus-command-fix','jarvis-core-3d']:
              s = re.sub(rf'<script[^>]+{re.escape(name)}\.js\?v=[^\"]+[^>]*></script>\s*', '', s)
          s = s.replace(marker, injection + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          touch _site/.nojekyll
          grep -q "velve-satellite-upgrade.js?v=pages-${SITE_VERSION:0:12}" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
