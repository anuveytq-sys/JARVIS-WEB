name: Publish JARVIS GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_VERSION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser JavaScript
        run: |
          node --check docs/jarvis-web.js
          node --check web-server.js
          node --check docs/jarvis-universal-service-router.js
          node --check docs/jarvis-github-access.js
          node --check docs/jarvis-platform-search.js
          node --check docs/jarvis-ui-patch.js
          node --check docs/jarvis-omni-skills.js
          node --check docs/jarvis-clap-snap-wake.js
          node --check docs/jarvis-hand-gestures.js
          node --check docs/jarvis-camera-fix.js
          node --check docs/jarvis-video-audio-fix.js
          node --check docs/jarvis-popup-fix.js
          node --check docs/jarvis-superpowers.js
          node --check docs/jarvis-focus-detector.js
          node --check docs/jarvis-music.js
          node --check docs/velve-countries.js
          node --check docs/jarvis-velve.js
          node --check docs/jarvis-velve-fix.js
          node --check docs/jarvis-velve-stability.js
          node --check docs/velve-satellite-upgrade.js
          node --check docs/velve-voice-fix.js
          node --check docs/terranexus.js
          node --check docs/terranexus-ui-fix.js
          node --check docs/jarvis-neon-nexus.js
          node --check docs/jarvis-neon-nexus-launcher-fix.js
          node --check docs/jarvis-neon-nexus-command-fix.js
          node --check docs/jarvis-core-3d.js
          node --check docs/jarvis-vision-intelligence.js
          node --check docs/jarvis-vision-intelligence-enhancement.js
          node --check docs/jarvis-environment-shortcuts.js
          node --check docs/jarvis-ultron.js
          node --check docs/jarvis-ultron-commands.js
          node --check docs/jarvis-ultron-digital-twin.js
          node --check docs/jarvis-calling.js
          node --check docs/jarvis-advanced-modules.js
          node --check docs/jarvis-power-modules.js
          node --check docs/jarvis-youtube-upload.js
          node --check docs/jarvis-beacon.js
          node --check docs/jarvis-mission-control.js
          node --check docs/jarvis-share.js
          node --check docs/jarvis-reminders-sw.js
          node --check docs/ultron-world-feed-v2.js

      - name: Verify VELVE fixes
        run: |
          grep -q 'velve-sat-interaction-20261015g' docs/velve-satellite-upgrade.js
          grep -q 'VELVE_VOICE_FIX_VERSION' docs/velve-voice-fix.js
          grep -q 'SpeechRecognition' docs/velve-voice-fix.js
          grep -q 'getUserMedia' docs/velve-voice-fix.js

      - name: Build Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp public/index.html _site/index.html
          for f in \
            jarvis-universal-service-router.js jarvis-github-access.js jarvis-platform-search.js jarvis-web.js \
            jarvis-youtube-upload.js jarvis-beacon.js jarvis-ui-patch.js jarvis-omni-skills.js jarvis-clap-snap-wake.js \
            jarvis-hand-gestures.js jarvis-camera-fix.js jarvis-video-audio-fix.js jarvis-popup-fix.js jarvis-superpowers.js \
            jarvis-focus-detector.js jarvis-music.js jarvis-velve.js jarvis-velve-fix.js jarvis-velve-stability.js \
            velve-satellite-upgrade.js velve-voice-fix.js terranexus.js terranexus-ui-fix.js jarvis-neon-nexus.js \
            jarvis-neon-nexus-launcher-fix.js jarvis-neon-nexus-command-fix.js jarvis-core-3d.js jarvis-vision-intelligence.js \
            jarvis-vision-intelligence-enhancement.js jarvis-environment-shortcuts.js jarvis-ultron.js jarvis-ultron-commands.js \
            jarvis-ultron-digital-twin.js jarvis-calling.js jarvis-advanced-modules.js jarvis-power-modules.js jarvis-mission-control.js jarvis-share.js \
            jarvis-reminders-sw.js ultron-world-feed-v2.js; do cp "docs/$f" "_site/$f"; done
          for f in jarvis-command-center.css jarvis-velve.css terranexus.css jarvis-neon-nexus.css jarvis-core-3d.css jarvis-vision-intelligence-enhancement.css manifest.webmanifest jarvis-pwa-icon.svg; do cp "docs/$f" "_site/$f"; done
          cp docs/velve-countries.js _site/velve-countries.js
          curl -fsSL https://raw.githubusercontent.com/anuveytq-sys/JARVIS-WEB/5b76480bc0b155fef1e25d57b755e9efa00e3838/docs/jarvis-vision-intelligence.css -o _site/jarvis-vision-intelligence.css

          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          url = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json'
          req = urllib.request.Request(url, headers={'User-Agent':'JARVIS-WEB-VELVE-static-snapshot/1.0','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  raw = json.load(r)
          except Exception as feed_error:
              mirror_url = 'https://raw.githubusercontent.com/satvisorcom/satvisor-data/master/celestrak/json/active.json'
              mirror_req = urllib.request.Request(mirror_url, headers={'User-Agent':'JARVIS-WEB-VELVE-static-snapshot/1.0','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(mirror_req, timeout=60) as r:
                      raw = json.load(r)
                  if not isinstance(raw, list) or len(raw) < 200:
                      raise RuntimeError('Satellite mirror returned fewer than 200 records')
              except Exception as mirror_error:
                  fallback_url = 'https://anuveytq-sys.github.io/JARVIS-WEB/velve-static-satellite-feed.js'
                  fallback_req = urllib.request.Request(fallback_url, headers={'User-Agent':'JARVIS-WEB-VELVE-static-snapshot/1.0'})
                  try:
                      with urllib.request.urlopen(fallback_req, timeout=30) as r:
                          text = r.read().decode('utf-8')
                      m = re.search(r'window\.__VELVE_STATIC_SATELLITES\s*=\s*(\[.*\]);', text, re.S)
                      if not m:
                          raise RuntimeError('Published satellite catalog was not parseable')
                      raw = json.loads(m.group(1))
                  except Exception as fallback_error:
                      raise SystemExit(f'Could not load satellite catalog: {feed_error}; {mirror_error}; {fallback_error}')

          fields = ('OBJECT_NAME','NORAD_CAT_ID','OBJECT_ID','EPOCH','MEAN_MOTION','ECCENTRICITY','INCLINATION','RA_OF_ASC_NODE','ARG_OF_PERICENTER','MEAN_ANOMALY','REV_AT_EPOCH')
          selected, seen = [], set()
          for item in raw:
              if not isinstance(item, dict): continue
              sid, name = item.get('NORAD_CAT_ID'), item.get('OBJECT_NAME')
              if sid is None or not name or str(sid) in seen: continue
              seen.add(str(sid)); selected.append({k:item.get(k) for k in fields if k in item})
              if len(selected) >= 240: break
          if len(selected) < 200: raise SystemExit(f'Expected at least 200 real satellites, got {len(selected)}')
          Path('_site/velve-static-satellite-feed.js').write_text('window.__VELVE_STATIC_SATELLITES = '+json.dumps(selected,separators=(',',':'))+';\n', encoding='utf-8')

          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          version = os.environ['SITE_VERSION'][:12]
          css_names = ['jarvis-command-center','jarvis-velve','terranexus','jarvis-neon-nexus','jarvis-core-3d','jarvis-vision-intelligence','jarvis-vision-intelligence-enhancement']
          css = ''.join(f'<link rel="stylesheet" href="./{n}.css?v=pages-{version}">\n' for n in css_names)
          for n in css_names:
              s = re.sub(rf'<link[^>]+{re.escape(n)}\.css[^>]*>\s*','',s)
          s = s.replace('</head>', css+'</head>', 1)
          scripts = ['jarvis-popup-fix','jarvis-omni-skills','jarvis-advanced-modules','jarvis-power-modules','jarvis-share','jarvis-calling','jarvis-beacon','jarvis-universal-service-router','jarvis-camera-fix','jarvis-video-audio-fix','jarvis-github-access','jarvis-platform-search','jarvis-ui-patch','jarvis-clap-snap-wake','jarvis-hand-gestures','jarvis-web','jarvis-youtube-upload','jarvis-music','jarvis-focus-detector','jarvis-superpowers','jarvis-velve-stability','velve-static-satellite-feed','velve-countries','jarvis-velve','jarvis-velve-fix','velve-satellite-upgrade','velve-voice-fix','terranexus','terranexus-ui-fix','jarvis-neon-nexus','jarvis-neon-nexus-launcher-fix','jarvis-neon-nexus-command-fix','jarvis-core-3d','jarvis-vision-intelligence','jarvis-vision-intelligence-enhancement','jarvis-ultron','jarvis-ultron-commands','jarvis-environment-shortcuts','jarvis-mission-control','ultron-world-feed-v2']
          for n in scripts:
              s = re.sub(rf'<script[^>]+{re.escape(n)}\.js[^>]*></script>\s*','',s)
          injection = ''.join(f'<script src="./{n}.js?v=pages-{version}"></script>\n' for n in scripts)
          s = s.replace('</body>', injection+'</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

          touch _site/.nojekyll
          test -s _site/jarvis-ultron.js
          test -s _site/jarvis-ultron-commands.js
          test -s _site/jarvis-ultron-digital-twin.js
          test -s _site/ultron-world-feed-v2.js
          grep -q "jarvis-ultron.js?v=pages-${SITE_VERSION:0:12}" _site/index.html
          grep -q "jarvis-ultron-commands.js?v=pages-${SITE_VERSION:0:12}" _site/index.html
          grep -q "jarvis-environment-shortcuts.js?v=pages-${SITE_VERSION:0:12}" _site/index.html
          grep -q "jarvis-beacon.js?v=pages-${SITE_VERSION:0:12}" _site/index.html
          grep -q "jarvis-calling.js?v=pages-${SITE_VERSION:0:12}" _site/index.html
          grep -q "ultron-world-feed-v2.js?v=pages-${SITE_VERSION:0:12}" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
