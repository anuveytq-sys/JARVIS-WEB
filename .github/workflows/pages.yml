name: Publish JARVIS GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser JavaScript
        run: |
          node --check docs/jarvis-web.js
          node --check docs/jarvis-ui-patch.js
          node --check docs/jarvis-camera-fix.js
          node --check docs/jarvis-popup-fix.js
          node --check docs/jarvis-superpowers.js
          node --check docs/jarvis-focus-detector.js
          node --check docs/jarvis-velve.js
          node --check docs/jarvis-velve-fix.js

      - name: Build Pages site from original HUD
        run: |
          rm -rf _site
          mkdir -p _site
          cp public/index.html _site/index.html
          cp docs/jarvis-web.js _site/jarvis-web.js
          cp docs/jarvis-ui-patch.js _site/jarvis-ui-patch.js
          cp docs/jarvis-camera-fix.js _site/jarvis-camera-fix.js
          cp docs/jarvis-popup-fix.js _site/jarvis-popup-fix.js
          cp docs/jarvis-superpowers.js _site/jarvis-superpowers.js
          cp docs/jarvis-focus-detector.js _site/jarvis-focus-detector.js
          cp docs/jarvis-command-center.css _site/jarvis-command-center.css
          cp docs/jarvis-velve.css _site/jarvis-velve.css
          cp docs/jarvis-velve.js _site/jarvis-velve.js
          cp docs/jarvis-velve-fix.js _site/jarvis-velve-fix.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          head_marker = '</head>'
          style = '<link rel="stylesheet" href="./jarvis-command-center.css?v=wakeword-match-20261013b">\n<link rel="stylesheet" href="./jarvis-velve.css?v=velve-20261013a">\n'
          if './jarvis-velve.css?v=velve-20261013a' not in s:
              s = s.replace(head_marker, style + head_marker, 1)
          marker = '</body>'
          injection = '<script src="./jarvis-popup-fix.js?v=popup-safe-20261013"></script>\n<script src="./jarvis-camera-fix.js?v=camera-voice-settings-20261013"></script>\n<script src="./jarvis-ui-patch.js?v=camera-voice-settings-20261013"></script>\n<script src="./jarvis-web.js?v=app-routing-youtube-explicit-20261013"></script>\n<script src="./jarvis-focus-detector.js?v=focus-detector-accuracy-20261013b"></script>\n<script src="./jarvis-superpowers.js?v=voice-command-fix-20261013b"></script>\n<script src="./jarvis-velve.js?v=velve-20261013b"></script>\n<script src="./jarvis-velve-fix.js?v=velve-launch-fix-20261013a"></script>\n'
          if './jarvis-velve.js?v=velve-' not in s:
              s = s.replace(marker, injection + marker, 1)
          elif './jarvis-velve-fix.js?v=velve-launch-fix-20261013a' not in s:
              s = s.replace(marker, '<script src="./jarvis-velve-fix.js?v=velve-launch-fix-20261013a"></script>\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
