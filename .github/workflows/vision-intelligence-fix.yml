name: Vision Intelligence button fix
on:
  push:
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Vision Intelligence quick investigation prompts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Vision Intelligence quick investigations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/jarvis-vision-intelligence.js')
          s=p.read_text(encoding='utf-8')
          marker='/* JVI QUICK INVESTIGATION BEHAVIOR FIX */'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          patch=r'''
/* JVI QUICK INVESTIGATION BEHAVIOR FIX */
(()=>{
  "use strict";
  const prompts={
    "explain how it works":"Analyze the already-captured image and explain what the identified subject is and how it works. Focus on visible components, purpose, operation, and relationships between parts. Give concrete, image-grounded information. Do not output safety classifications, moderation labels, policy text, or JSON; return the useful analysis directly.",
    "inspect visible parts":"Inspect the already-captured image carefully. List the important visible parts/components, where they are located, what each appears to do, and any visible markings or interfaces. Separate observations from reasonable inferences. Do not output safety classifications, moderation labels, policy text, or JSON; return the visual findings directly.",
    "discover key facts":"Using the already-captured image, identify the main subject and give useful, interesting facts directly relevant to what is visible. Include distinguishing features, likely purpose, context, and notable details. Clearly label anything uncertain. Do not output safety classifications, moderation labels, policy text, or JSON; return the relevant facts directly.",
    "check uncertainty":"Review the already-captured image and identify what can be determined confidently, what remains uncertain, why it is uncertain, and what additional visual detail or angle would improve identification. Do not output safety classifications, moderation labels, policy text, or JSON; return the uncertainty analysis directly."
  };
  const apply=()=>document.querySelectorAll('#jvi-root .jvi-quick button').forEach(btn=>{
    const text=btn.textContent.toLowerCase();
    const hit=Object.keys(prompts).find(k=>text.includes(k));
    if(hit) btn.setAttribute('data-q',prompts[hit]);
  });
  apply();
  new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true});
})();
'''
          p.write_text(s+patch,encoding='utf-8')
          PY
      - name: Commit Vision fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/jarvis-vision-intelligence.js
          git rm .github/workflows/vision-intelligence-fix.yml
          git commit -m 'Fix Vision Intelligence quick investigation prompts'
          git push
